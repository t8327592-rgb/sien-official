<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=https://www.sien-official.com/">
    <title>ホームページ移転のお知らせ | Sien-Official</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #fff9f5; color: #333; text-align: center; padding: 50px 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #f97316; font-size: 24px; margin-bottom: 20px; }
        p { margin-bottom: 20px; }
        .btn { display: inline-block; padding: 15px 30px; background-color: #f97316; color: #fff; text-decoration: none; font-weight: bold; border-radius: 30px; margin-top: 20px; }
        .btn:hover { background-color: #ea580c; }
        .loader { margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #f97316; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>ホームページ移転のお知らせ</h1>
        <p>Sien-Officialのホームページはリニューアルに伴い、新しいURLへ移転いたしました。</p>
        <p>今後のご依頼・お問い合わせは、新ホームページをご利用いただきますようお願いいたします。</p>
        <p><strong>新ホームページURL：</strong><br><a href="https://www.sien-official.com/">https://www.sien-official.com/</a></p>
        
        <a href="https://www.sien-official.com/" class="btn">新ホームページへ移動する</a>
        
        <div class="loader"></div>
        <p style="font-size: 14px; color: #666;">5秒後に自動的に新ホームページへ移動します...</p>
    </div>
</body>
</html>
