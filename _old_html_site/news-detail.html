    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');
            const container = document.getElementById('news-detail-container');

            if (!articleId) {
                container.innerHTML = '<p style="text-align:center; padding: 40px; color: #999;">記事が見つかりません。</p>';
                return;
            }

            try {
                const res = await fetch('/api/admin?type=public');
                if (res.ok) {
                    const data = await res.json();
                    const newsList = data.newsList || [];
                    const article = newsList.find(n => n.id === articleId && n.visible !== false);

                    if (article) {
                        // OGP dynamically setting (note: standard crawlers may not execute JS, but useful for some platforms)
                        document.title = article.title + ' | Sien-Official';

                        container.innerHTML = `
                            <article class="news-article" style="background:white; padding:40px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); margin-bottom:30px;">
                                <div class="news-meta" style="margin-bottom:15px;">
                                    <span class="news-date">${article.date}</span>
                                    <span class="news-label">${article.label || 'お知らせ'}</span>
                                </div>
                                <h1 class="article-title" style="font-size:1.8rem; margin-bottom:30px; padding-bottom:15px; border-bottom:1px solid #eee;">${article.title}</h1>
                                <div class="article-body ql-editor" style="font-size:1.05rem; line-height:1.8; color:#333;">
                                    ${article.content || ''}
                                </div>
                            </article>
                        `;
                    } else {
                        container.innerHTML = '<p style="text-align:center; padding: 40px; color: #999;">記事が見つからないか、公開されていません。</p>';
                    }
                } else {
                    container.innerHTML = '<p style="text-align:center; padding: 40px; color: #999;">読み込みに失敗しました。</p>';
                }
            } catch (e) {
                console.error(e);
                container.innerHTML = '<p style="text-align:center; padding: 40px; color: #999;">エラーが発生しました。</p>';
            }
        });
    </script>
